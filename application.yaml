# Argo CD Application untuk aq-service — SS-302 P7
# Ganti OWNER/REPO dengan repository kelompok. Terapkan dengan:
#   kubectl apply -n argocd -f argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aq-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/OWNER/REPO.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ss302
  syncPolicy:
    automated:
      prune: true      # hapus objek yang sudah tidak ada di Git
      selfHeal: true   # kembalikan perubahan manual di cluster ke isi Git
    syncOptions:
      - CreateNamespace=true
