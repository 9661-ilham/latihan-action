name: Cetak Versi Python

on: [push]

jobs:
  versi-python:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cetak versi Python
        run: python --version
