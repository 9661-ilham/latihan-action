apiVersion: apps/v1
kind: Deployment
metadata:
  name: aq-service
  namespace: ss302
  labels:
    app: aq-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aq-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: aq-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: aq-service
          # Ganti OWNER (huruf kecil) dan tag dengan hasil CI terakhir, misalnya sha-1a2b3c4.
          # Mengubah baris ini lalu commit = merilis versi baru (GitOps).
          image: ghcr.io/9661-ilham/aq-service:sha-0000000
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: aq-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      # Hanya diperlukan bila image GHCR private. Bila secret ini tidak ada,
      # Kubernetes hanya memberi peringatan selama image sudah ada di node.
      imagePullSecrets:
        - name: ghcr-cred
