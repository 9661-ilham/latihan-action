# HANYA untuk repository PRIVATE. Salin ke luar repo, isi, lalu:
#   kubectl apply -f repo-secret.yaml
# JANGAN commit file berisi token. Token cukup classic PAT dengan scope repo (baca),
# atau fine-grained token dengan izin Contents: Read-only untuk repo ini.
apiVersion: v1
kind: Secret
metadata:
  name: repo-aq-service
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/9661-ilham/REPO.git
  username: GITHUB_USERNAME
  password: TOKEN_JANGAN_DICOMMIT
